<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recovery Guidance &mdash; Step-by-Step Disaster Protocols &mdash; RecoveryBoard</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Pure CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Top Offline Banner -->
  <div id="offline-banner"></div>

  <!-- Global Header -->
  <div id="global-header"></div>

  <main class="container container-narrow" style="padding-top: 2rem; padding-bottom: 4rem;">
    
    <!-- Breadcrumb -->
    <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1.5rem;">
      <a href="../index.html">Home</a> &gt; <span style="color: var(--navy-800);">Recovery Guidance</span>
    </div>

    <!-- Heading (Section 29) -->
    <div style="margin-bottom: 2rem;">
      <span class="badge badge-assigned" style="margin-bottom:0.4rem;">OFFICIAL DISASTER PLAYBOOKS</span>
      <h1 style="font-size: 2.2rem; font-weight: 900; color: var(--primary-900); letter-spacing: -0.02em;">
        Citizen Recovery Guidance
      </h1>
      <p style="font-size: 1rem; color: var(--text-sub); margin-top: 0.25rem;">
        Clear, actionable step-by-step guides for surviving and recovering from structural house damage, document loss, insurance claims, and utility safety.
      </p>
    </div>

    <!-- Search box -->
    <div class="card" style="padding: 1rem 1.25rem; margin-bottom: 2rem; position: relative;">
      <input type="text" id="guidanceSearchInput" class="form-control" placeholder="Search guidance: house damage, insurance, lost Aadhaar, gas leak..." style="padding-left: 2.5rem;">
      <span style="position: absolute; left: 2.1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem;">🔍</span>
    </div>

    <!-- Guidance Guides List (Section 29) -->
    <div id="guidanceTopicsList" style="display: flex; flex-direction: column; gap: 2rem;">
      <!-- Populated dynamically by script -->
    </div>

  </main>

  <!-- Global Footer -->
  <div id="global-footer"></div>

  <!-- Mobile Bottom Nav -->
  <div id="mobile-bottom-nav"></div>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let query = '';

      function renderGuidance() {
        const container = document.getElementById('guidanceTopicsList');
        if (!container) return;

        let topics = GUIDANCE_TOPICS;
        if (query) {
          topics = topics.filter(t => 
            t.title.toLowerCase().includes(query) ||
            t.steps.some(s => s.title.toLowerCase().includes(query) || s.desc.toLowerCase().includes(query))
          );
        }

        if (topics.length === 0) {
          container.innerHTML = `
            <div class="empty-state card">
              <div class="empty-state-icon">🧭</div>
              <div class="empty-state-title">No matching guides found</div>
              <div class="empty-state-desc">Try searching for keywords like "damage", "documents", "safety", or "insurance".</div>
            </div>
          `;
          return;
        }

        container.innerHTML = topics.map(t => `
          <div class="card" id="${t.id}" style="padding: 2rem; border-top: 4px solid var(--navy-800);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem;">
              <div>
                <span class="badge badge-assigned">${t.badge}</span>
                <h2 style="font-size: 1.5rem; font-weight: 900; color: var(--primary-900); margin-top: 0.4rem; display: flex; align-items: center; gap: 0.5rem;">
                  <span>${t.icon}</span>
                  <span>${t.title}</span>
                </h2>
              </div>
            </div>

            <!-- Steps Stepper (Section 29) -->
            <div style="display: flex; flex-direction: column; gap: 1rem;">
              ${t.steps.map((st, idx) => `
                <div style="display: flex; gap: 1.25rem; align-items: flex-start;">
                  <div style="
                    width: 44px;
                    height: 44px;
                    border-radius: 50%;
                    background: var(--primary-100);
                    color: var(--navy-800);
                    font-family: var(--font-mono);
                    font-weight: 900;
                    font-size: 1.1rem;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex-shrink: 0;
                    border: 2px solid var(--border-subtle);
                  ">
                    ${st.num}
                  </div>

                  <div style="flex: 1; padding-top: 0.25rem;">
                    <h4 style="font-size: 1.05rem; font-weight: 800; color: var(--primary-900); margin-bottom: 0.25rem;">
                      ${st.title}
                    </h4>
                    <p style="font-size: 0.85rem; color: var(--text-sub); line-height: 1.5;">
                      ${st.desc}
                    </p>
                  </div>
                </div>
                ${idx < t.steps.length - 1 ? '<div style="margin-left: 21px; width: 2px; height: 18px; background: var(--border-light);"></div>' : ''}
              `).join('')}
            </div>
          </div>
        `).join('');
      }

      document.getElementById('guidanceSearchInput')?.addEventListener('input', (e) => {
        query = e.target.value.toLowerCase().trim();
        renderGuidance();
      });

      renderGuidance();
    });
  </script>
</body>
</html>
