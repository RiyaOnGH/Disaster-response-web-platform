<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Need Help &mdash; Essential Resources &mdash; RecoveryBoard</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Pure CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Top Offline Banner -->
  <div id="offline-banner"></div>

  <!-- Global Header -->
  <div id="global-header"></div>

  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
    
    <!-- Breadcrumb -->
    <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1.5rem;">
      <a href="../index.html">Home</a> &gt; <span style="color: var(--navy-800);">I Need Help</span>
    </div>

    <!-- Heading (Section 18) -->
    <div style="margin-bottom: 2rem;">
      <span class="badge badge-assigned" style="margin-bottom: 0.4rem;">VERIFIED RELIEF DIRECTORY</span>
      <h1 style="font-size: 2.2rem; font-weight: 900; color: var(--primary-900); letter-spacing: -0.02em;">
        What do you need help with?
      </h1>
      <p style="font-size: 1rem; color: var(--text-sub); margin-top: 0.25rem;">
        Select a category below to discover nearby operating relief shelters, potable water tankers, mobile medical posts and solar charging points.
      </p>
    </div>

    <!-- Category Selection Cards Grid (Section 18) -->
    <div id="helpCategoryGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.85rem; margin-bottom: 2.5rem;">
      <!-- Populated by help.js -->
    </div>

    <!-- Search & Filter Bar -->
    <div class="card" style="padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
      
      <!-- Search Input -->
      <div style="flex: 1; min-width: 260px; position: relative;">
        <input type="text" id="resourceSearchInput" class="form-control" placeholder="Search resources, water tankers, clinics, shelters..." style="padding-left: 2.5rem;">
        <span style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem;">🔍</span>
      </div>

      <!-- Result count & sort -->
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span id="resourceResultCount" style="font-size: 0.8rem; font-weight: 700; color: var(--text-sub); white-space: nowrap;">
          Loading resources...
        </span>
        <select id="resourceSortSelect" class="form-control" style="width: auto; padding: 0.5rem 0.85rem; font-size: 0.82rem; font-weight: 600;">
          <option value="distance">Sort: Nearest Distance</option>
          <option value="name">Sort: Name (A-Z)</option>
        </select>
      </div>

    </div>

    <!-- Nearby Resources Cards Grid (Section 19) -->
    <div id="resourcesListContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem;">
      <!-- Populated dynamically by help.js -->
    </div>

  </main>

  <!-- Global Footer -->
  <div id="global-footer"></div>

  <!-- Mobile Bottom Nav -->
  <div id="mobile-bottom-nav"></div>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/help.js"></script>
</body>
</html>
