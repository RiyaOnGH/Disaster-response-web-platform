<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verified Local Updates &mdash; Official Disaster Bulletins &mdash; RecoveryBoard</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Pure CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Top Offline Banner -->
  <div id="offline-banner"></div>

  <!-- Global Header -->
  <div id="global-header"></div>

  <main class="container container-narrow" style="padding-top: 2rem; padding-bottom: 4rem;">
    
    <!-- Breadcrumb -->
    <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1.5rem;">
      <a href="../index.html">Home</a> &gt; <span style="color: var(--navy-800);">Local Updates</span>
    </div>

    <!-- Heading (Section 23) -->
    <div style="margin-bottom: 2rem;">
      <span class="badge badge-verified" style="margin-bottom: 0.4rem;">TRUSTED CIVIC BROADCASTS</span>
      <h1 style="font-size: 2.2rem; font-weight: 900; color: var(--primary-900); letter-spacing: -0.02em;">
        Verified Local Updates
      </h1>
      <p style="font-size: 1rem; color: var(--text-sub); margin-top: 0.25rem;">
        Real-time municipal bulletins on flood road closures, potable water tankers, hospital operations, and power grid energization.
      </p>
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="card" style="padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between;">
      <div style="flex: 1; min-width: 240px; position: relative;">
        <input type="text" id="updatesSearchInput" class="form-control" placeholder="Search bulletins, roads, hospital, power grid..." style="padding-left: 2.5rem;">
        <span style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem;">🔍</span>
      </div>

      <div style="display:flex; gap:0.4rem; overflow-x:auto;">
        <button class="filter-chip active" data-update-cat="all">All</button>
        <button class="filter-chip" data-update-cat="roads">🚧 Roads</button>
        <button class="filter-chip" data-update-cat="water">💧 Water</button>
        <button class="filter-chip" data-update-cat="electricity">⚡ Power</button>
        <button class="filter-chip" data-update-cat="medical">🏥 Medical</button>
      </div>
    </div>

    <!-- Bulletins Feed (Section 23 & 24) -->
    <div id="updatesFeedList" style="display: flex; flex-direction: column; gap: 1rem;">
      <!-- Populated dynamically by script -->
    </div>

  </main>

  <!-- Global Footer -->
  <div id="global-footer"></div>

  <!-- Mobile Bottom Nav -->
  <div id="mobile-bottom-nav"></div>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let activeFilter = 'all';
      let searchVal = '';

      function renderFeed() {
        const container = document.getElementById('updatesFeedList');
        if (!container) return;

        let items = App.getUpdates();

        if (activeFilter !== 'all') {
          items = items.filter(u => u.category === activeFilter);
        }

        if (searchVal) {
          items = items.filter(u => 
            u.title.toLowerCase().includes(searchVal) ||
            u.content.toLowerCase().includes(searchVal) ||
            u.source.toLowerCase().includes(searchVal) ||
            u.affectedArea.toLowerCase().includes(searchVal)
          );
        }

        if (items.length === 0) {
          container.innerHTML = `
            <div class="empty-state card">
              <div class="empty-state-icon">📢</div>
              <div class="empty-state-title">No matching updates</div>
              <div class="empty-state-desc">Try clearing search terms or selecting another category.</div>
            </div>
          `;
          return;
        }

        container.innerHTML = items.map(u => {
          let statusBadgeClass = 'badge-working';
          if (u.statusType === 'danger') statusBadgeClass = 'badge-critical';
          else if (u.statusType === 'success') statusBadgeClass = 'badge-resolved';
          else if (u.statusType === 'info') statusBadgeClass = 'badge-assigned';

          return `
            <article class="card" style="padding: 1.5rem; border-left: 4px solid ${u.statusType === 'danger' ? 'var(--emergency-600)' : u.statusType === 'success' ? 'var(--success-600)' : 'var(--warning-500)'};">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.75rem;">
                <div>
                  <span class="badge ${statusBadgeClass}">${u.status}</span>
                  <span style="font-size:0.8rem; font-weight:700; color:var(--text-muted); margin-left:0.5rem;">
                    📍 ${u.affectedArea}
                  </span>
                </div>
                <span style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono);">
                  🕒 ${u.timestamp}
                </span>
              </div>

              <h3 style="font-size: 1.25rem; font-weight: 800; color: var(--primary-900); margin-bottom: 0.5rem; line-height: 1.3;">
                ${u.title}
              </h3>

              <p style="font-size: 0.9rem; color: var(--text-sub); line-height: 1.6; margin-bottom: 1.25rem;">
                ${u.content}
              </p>

              <!-- Verification Footer (Section 24) -->
              <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; border-top:1px solid var(--border-light); padding-top:0.75rem; font-size:0.78rem;">
                <div style="display:flex; align-items:center; gap:0.5rem;">
                  <span style="color:var(--text-muted);">Source:</span>
                  <strong style="color:var(--primary-900);">${u.source}</strong>
                </div>
                <div style="display:flex; align-items:center; gap:0.4rem; color:var(--success-700); font-weight:800;">
                  <span>✓</span>
                  <span>Verified by Response Team</span>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      // Filter chips
      document.querySelectorAll('[data-update-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-update-cat]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeFilter = btn.getAttribute('data-update-cat');
          renderFeed();
        });
      });

      // Search
      document.getElementById('updatesSearchInput')?.addEventListener('input', (e) => {
        searchVal = e.target.value.toLowerCase().trim();
        renderFeed();
      });

      renderFeed();
    });
  </script>
</body>
</html>
